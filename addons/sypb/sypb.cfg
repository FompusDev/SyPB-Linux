// ==============================================================================
//  SyPB Bot Configuration File (sypb.cfg)
//  Project: SyPB Linux Edition
//  Authors: SyPB Team & _unique_
//  GitHub:  https://github.com/FompusDev/SyPB-Linux
//  Discord: https://discord.gg/dB2HdnHasV
// ==============================================================================
// This configuration file controls the behavior, quota, difficulty, game modes,
// and navigation options for SyPB bots running on Counter-Strike 1.6 / ReHLDS servers.
// ==============================================================================

echo "Executing SyPB Bot configuration (sypb.cfg)..."

// ------------------------------------------------------------------------------
// [1] CORE & BOT QUOTA SETTINGS
// ------------------------------------------------------------------------------

// Specifies the fixed number of bots to maintain on the server.
// If set to 0, no bots will automatically join on round start.
// Default: 8
sypb_quota 8

// Dynamic bot quota management based on real human players.
// If set to -1, dynamic balance is disabled and sypb_quota is strictly used.
// If set to a number (e.g., 10), the total number of players (humans + bots)
// will always equal this number: Bots = max(0, sypb_auto_players - human_players).
// Default: -1
sypb_auto_players -1

// Controls whether bots only join after at least one human player joins the server.
// 0 = Bots join immediately even if the server is empty (keeps server active).
// 1 = Bots only spawn once a human player connects; bots leave when all humans leave.
// Default: 0
sypb_join_after_player 0

// Forces all newly created bots to join a specific team.
// "any" = Auto-balance between Terrorists and Counter-Terrorists.
// "t"   = Force bots to join Terrorist team.
// "ct"  = Force bots to join Counter-Terrorist team.
// Default: "any"
sypb_forceteam "any"


// ------------------------------------------------------------------------------
// [2] WAYPOINTS & NAVIGATION
// ------------------------------------------------------------------------------

// Controls whether bots require existing waypoint files (.pwf) to join a map.
// 0 = ALLOW bots to join ANY map without pre-made waypoints (RECOMMENDED).
//     If no waypoint file exists, SyPB will automatically generate basic navigation
//     waypoints from player spawn points, VIP escapes, rescue zones, and ladders!
// 1 = STRICT check: bots will ONLY join maps that have an existing waypoint file (.pwf)
//     in the "addons/sypb/wptdefault/" folder. If missing, no bots will join.
// Default: 0
sypb_waypoint_check 0

// Waypoint auto-download feature.
// 0 = Disabled (only local waypoints from wptdefault/ will be used).
// 1 = Check and download missing waypoints from official repository.
// 2 = Download missing waypoints only if local file is missing.
// Default: 1
sypb_download_waypoint 1

// Waypoint danger factor weight.
// Dictates how strongly bots avoid areas where teammates previously died.
// Higher values make bots more cautious and avoid sniper choke points.
// Default: 800
sypb_dangerfactor 800


// ------------------------------------------------------------------------------
// [3] DIFFICULTY & COMBAT
// ------------------------------------------------------------------------------

// Bot skill level / difficulty.
// 0 = Newbie / Very Easy (slow reaction, low accuracy)
// 1 = Easy
// 2 = Normal (balanced for casual servers)
// 3 = Hard (sharp reaction, good crosshair placement)
// 4 = Expert (tournament-level precision and fast headshots)
// Default: 2
sypb_difficulty 2

// Percentage of bots that will automatically follow a human teammate at round start.
// Range: 0 to 100
// Default: 50
sypb_followpercent 50

// Knife-only combat mode.
// 0 = Disabled (bots use pistols, rifles, grenades, and knives normally).
// 1 = Enabled (bots will only fight using knives).
// Default: 0
sypb_knifemode 0

// Team eco-rounds strategy.
// Controls whether bots save money during low-cash rounds to afford rifles later.
// 0 = Disabled (bots always spend available money on best available gear).
// 1 = Enabled (bots coordinate team economy like competitive players).
// Default: 0
sypb_ecorounds 0

// Weapon restriction list.
// Semicolon-delimited list of weapon names that bots are forbidden to buy or pick up.
// Example: "shield;glock18;deagle;usp;p228;fiveseven;m3;xm1014;tmp;mac10;ump45;p90"
// Default: "shield;glock18;deagle;usp;p228;fiveseven"
sypb_restrictweapons "shield;glock18;deagle;usp;p228;fiveseven"


// ------------------------------------------------------------------------------
// [4] GAME MODES & ZOMBIE PLAGUE SUPPORT
// ------------------------------------------------------------------------------

// Game mode handler:
// 0 = Standard Counter-Strike (Bomb defuse / Hostage rescue / VIP assassination).
// 1 = Team Deathmatch / CSDM (Free roam, instant respawn navigation).
// 2 = Zombie Plague / Biohazard mode:
//     - Bots correctly recognize zombies vs humans.
//     - Humans retreat, barricade, group up, and maintain distance.
//     - Zombie bots hunt humans aggressively and avoid long-range open lanes.
// Default: 2
sypb_gamemod 2

// Infection delay time (in seconds) for Zombie Plague mode.
// Gives bots time before engaging in full zombie combat protocols.
// Default: 0.0
sypb_zmdelay_time 0.0

// Ignore enemies combat flag.
// 0 = Normal combat (bots actively target and shoot enemies).
// 1 = Peaceful mode (bots ignore all enemies; useful for testing waypoints).
// Default: 0
sypb_ignore_enemies 0

// Freeze / stop all bots on the server.
// 0 = Normal movement.
// 1 = Freeze all bots in place (useful for waypoint editing and server debugging).
// Default: 0
sypb_stopbots 0


// ------------------------------------------------------------------------------
// [5] VISUALS, SCOREBOARD & CHAT
// ------------------------------------------------------------------------------

// Language used for bot menus, in-game radio, and console messages.
// Available options:
// "en" = English
// "ru" = Russian
// "cn" = Chinese
// Default: "en"
sypb_language "en"

// Displays fake ping in the TAB scoreboard for bots instead of "BOT".
// 0 = Displays simulated player ping (makes bots look like real players).
// 1 = Displays "BOT" tag in scoreboard.
// Default: 0
sypb_tagbots 0

// Appends clan tag / prefix to bot names.
// 0 = Pure player nicknames without prefix (e.g. "Shadow", "Hunter").
// 1 = Prefixes names with clan tag (e.g. "[SyPB] Shadow").
// Default: 0
sypb_nametag 0

// Bot text chat simulation.
// 0 = Disabled (keeps server chat clean).
// 1 = Enabled (bots send greetings, reactions, and chat messages).
// Default: 0
sypb_chat 0

// Bot radio commands.
// 0 = Disabled (silent radio).
// 1 = Enabled (bots use standard CS 1.6 radio commands).
// Default: 1
sypb_radio 1

// Logo spraying.
// 0 = Disabled.
// 1 = Bots occasionally spray logos on walls.
// Default: 0
sypb_spraypaints 0

// SyPB welcome message when players connect.
// 0 = Disabled.
// 1 = Displays welcome notification in chat.
// Default: 0
sypb_welcomemsg 0


// ------------------------------------------------------------------------------
// [6] SECURITY & ADMIN MANAGEMENT
// ------------------------------------------------------------------------------

// The setinfo key used to authenticate an admin for the SyPB in-game menu.
// Players must run in their client console: setinfo "_sypb_pw" "your_password"
// Default: "_sypb_pw"
sypb_password_key "_sypb_pw"

// The password string for in-game admin menu access.
// Leave empty ("") to allow any server administrator with RCON to open the menu.
// Default: ""
sypb_password ""

// Prevent built-in CZ/CS 1.6 zbot from loading simultaneously to avoid crashes.
// Default: 1
sypb_lockzbot 1

// Server console logging level for bot diagnostic messages.
// 0 = Disabled (critical errors only).
// 1 = General warnings and status updates.
// 2 = Detailed logging.
// Default: 2
sypb_loglevel 2

// Waypoint debug editor display.
// 0 = Waypoint lines and editor beams hidden.
// 1 = Show waypoints (used while mapping in waypoint edit mode).
// Default: 0
sypb_showwp 0

// Keybind shortcut for server administrators to open SyPB menu:
// Press "=" in-game to open the SyPB Bot Management Menu.
bind "=" "sypb menu"

echo "SyPB Bot configuration successfully loaded!"
